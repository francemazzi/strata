name: Sign release assets
on:
  workflow_run:
    workflows:
      - '🍎 Build - MacOS Qt6'
      - '🪟 Windows Qt6'
      - '🐧 Build AppImage (Linux)'
      - '🪟 Windows Release Manual'
      - 'Package macOS release from artifacts'
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Explicit draft release tag to seal
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: seal-strata-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  seal:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       startsWith(github.event.workflow_run.head_branch, 'strata-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Seal complete draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: node scripts/ci/seal-release.mjs "$RELEASE_TAG"
