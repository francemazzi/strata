name: 🚀 Release Strata
on:
  push:
    tags: ['strata-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Strata tag to prepare as a draft
        required: true
        type: string
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Prepare draft for the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/ci/release-assets.mjs draft "$RELEASE_TAG"
