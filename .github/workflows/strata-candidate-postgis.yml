name: Strata candidate updater check (Linux)
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write # required for reading draft assets
jobs:
  updater:
    if: inputs.tag == 'strata-v1.9.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STRATA_QA_ASSET: Strata-1.9.1-x86_64.AppImage
      STRATA_QA_LOG: linux.jsonl
      DISPLAY: ":22"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/run_candidate_updater.py
          sparse-checkout-cone-mode: false
      - name: Download the exact release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export STRATA_QA_ROOT="$RUNNER_TEMP/strata-updater"
          echo "STRATA_QA_ROOT=$STRATA_QA_ROOT" >> "$GITHUB_ENV"
          echo "STRATA_CUSTOM_CONFIG_PATH=$RUNNER_TEMP/strata-profile" >> "$GITHUB_ENV"
          mkdir -p "$STRATA_QA_ROOT/candidate" "$STRATA_QA_ROOT/previous"
          gh release download strata-v1.9.0 --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --pattern '*.AppImage.sha256' --dir "$STRATA_QA_ROOT/previous"
          gh release download strata-v1.9.1 --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --pattern 'update-manifest.*' --dir "$STRATA_QA_ROOT/candidate"
          (cd "$STRATA_QA_ROOT/previous" && sha256sum --check Strata-1.9.0-x86_64.AppImage.sha256)
          cd "$STRATA_QA_ROOT/candidate"
          jq -r '.packages[] | select(.platform=="linux") | .sha256 + "  " + (.url|split("/")|last)' update-manifest.json | sha256sum --check
      - name: Install a disposable display
        run: |
          sudo apt-get -qq update
          sudo apt-get -y -qq install --no-install-recommends xvfb xauth libegl1 libopengl0 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0
      - name: Exercise the packaged updater
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x800x24 -nolisten tcp > "$STRATA_QA_ROOT/xvfb.log" 2>&1 &
          root="$STRATA_CUSTOM_CONFIG_PATH/profiles/default/Strata"
          mkdir -p "$root" "$STRATA_QA_ROOT/installed"
          printf '[authentication]\nuse-password-helper=false\ngenerate-random-password-for-keychain=false\n' > "$root/Strata.ini"
          app="$STRATA_QA_ROOT/installed/Strata.AppImage"
          install -m 755 "$STRATA_QA_ROOT/previous/Strata-1.9.0-x86_64.AppImage" "$app"
          "$app" --lang en_US --noplugins --nologo --code "$GITHUB_WORKSPACE/scripts/ci/run_candidate_updater.py" > "$STRATA_QA_ROOT/application.log" 2>&1 &
          for ((seconds=0; seconds<420; seconds+=3)); do
            result=$(find "${TMPDIR:-/tmp}" -maxdepth 3 -type f -name install.json.result -print -quit 2>/dev/null || true)
            if [[ -n "$result" ]] && grep -q 'Update confirmed' "$result"; then
              cp "$result" "$STRATA_QA_ROOT/install.result"
              break
            fi
            if [[ -f "$STRATA_QA_ROOT/linux.jsonl" ]] && grep -q '"event": "failure"' "$STRATA_QA_ROOT/linux.jsonl"; then
              break
            fi
            sleep 3
          done
          if [[ -n "${result:-}" ]]; then
            cp "$result" "$STRATA_QA_ROOT/install.result"
            cat "$STRATA_QA_ROOT/install.result"
          fi
          tail -20 "$STRATA_QA_ROOT/linux.jsonl"
          test -f "$STRATA_QA_ROOT/install.result"
          grep -q 'Update confirmed' "$STRATA_QA_ROOT/install.result"
          cmp "$app" "$STRATA_QA_ROOT/candidate/$STRATA_QA_ASSET"
          grep -q 'qa-upgrade-marker=retained' "$root/Strata.ini"
          jq -r 'select(.event=="qa-start") | .project_sha256 + "  linux.qgz"' "$STRATA_QA_ROOT/linux.jsonl" | (cd "$STRATA_QA_ROOT" && sha256sum --check)
      - name: Save the updater evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-updater-evidence
          path: |
            ${{ env.STRATA_QA_ROOT }}/*.log
            ${{ env.STRATA_QA_ROOT }}/*.result
            ${{ env.STRATA_QA_ROOT }}/*.jsonl
