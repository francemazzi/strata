name: Windows release signing checks
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate platform to test
        type: choice
        options: [all, linux, windows]
        default: all
        required: true
permissions:
  contents: read
jobs:
  linux-candidate-postgis:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: strata_crs_candidate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55013:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        run: |
          test "$(git rev-parse strata-v1.6.3^{commit})" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Download and verify candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download strata-v1.6.3 --repo francemazzi/strata --pattern 'Strata-1.6.3-x86_64.AppImage'
          gh release view strata-v1.6.3 --repo francemazzi/strata --json assets > candidate-assets.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          name='Strata-1.6.3-x86_64.AppImage'
          asset=next(a for a in json.loads(pathlib.Path('candidate-assets.json').read_text())['assets'] if a['name']==name)
          with open(name,'rb') as file: digest=hashlib.file_digest(file,'sha256').hexdigest()
          assert asset['digest']=='sha256:'+digest
          PY
          chmod +x Strata-1.6.3-x86_64.AppImage
      - name: Test packaged desktop with isolated PostGIS
        env:
          STRATA_CRS_TEST_DB: host=127.0.0.1 port=55013 dbname=strata_crs_candidate user=postgres sslmode=disable
        run: python3 scripts/ci/test_candidate_postgis.py ./Strata-1.6.3-x86_64.AppImage --asset Strata-1.6.3-x86_64.AppImage --output postgis-candidate-linux.json
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-linux
          path: postgis-candidate-linux.json
          if-no-files-found: error
  candidate-postgis:
    if: inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        shell: bash
        run: |
          test "$(git rev-parse strata-v1.6.3^{commit})" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Test candidate with isolated PostGIS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/test-candidate-postgis-windows.ps1
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-windows
          path: postgis-candidate-windows.json
          if-no-files-found: error
