---
name: 🪟 Windows Qt6
on:
  push:
    branches:
      - master
      - release-**
    tags:
      - 'strata-v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

env:
  IS_STRATA_RELEASE: ${{ startsWith(github.ref, 'refs/tags/strata-v') }}
  USE_WINDOWS_SDK: ${{ startsWith(github.ref, 'refs/tags/strata-v') || github.event_name == 'push' || github.event_name == 'pull_request' }}
  WINDOWS_RELEASE_SDK_RUN_ID: '29234806065'
  WINDOWS_RELEASE_SDK_ARTIFACT_NAME: strata-sdk-x64-windows

jobs:
  build:
    name: build (windows)
    environment: ${{ startsWith(github.ref, 'refs/tags/strata-v') && 'windows-release' || 'windows-ci' }}
    runs-on: windows-2022
    # See macOS workflow: keep vcpkg cache enabled for tag builds too. The
    # 6h job timeout (GitHub free tier) was being hit when caching was
    # disabled. Configuration errors now fail the build.

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Require signed draft release
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: |
          ./scripts/ci/assert-windows-signing.ps1
          node scripts/ci/release-assets.mjs draft $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Release target validation failed.' }

      - name: 🔨 Uninstall system cmake
        shell: bash
        run: |
          choco uninstall cmake.install

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9
        with:
          cmakeVersion: 3.31.6

      - name: 🧽 Developer Command Prompt for Microsoft Visual C++
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 #v1

      - name: 📥 Download Windows SDK
        id: download-sdk
        if: ${{ env.USE_WINDOWS_SDK == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v6.0.1
        with:
          name: ${{ env.WINDOWS_RELEASE_SDK_ARTIFACT_NAME }}
          run-id: ${{ env.WINDOWS_RELEASE_SDK_RUN_ID }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sdk-artifact

      - name: ⚠️ Windows SDK cache miss
        if: ${{ env.USE_WINDOWS_SDK == 'true' && steps.download-sdk.outcome != 'success' }}
        shell: bash
        run: |
          echo "::warning::Cached Windows SDK artifact is missing or expired; rebuilding from vcpkg."
          echo "This adds significant build time but keeps release tags buildable without manual SDK refresh."

      - name: 📦 Extract Windows SDK
        if: ${{ env.USE_WINDOWS_SDK == 'true' && steps.download-sdk.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p sdk-root
          SDK_ZIP=$(find sdk-artifact -name 'vcpkg-export-*.zip' -print -quit)
          if [ -z "${SDK_ZIP}" ]; then
            echo "ERROR: vcpkg export zip not found in SDK artifact"
            find sdk-artifact -maxdepth 3 -type f -print
            exit 1
          fi
          7z x "${SDK_ZIP}" -osdk-root -y
          SDK_DIR=$(find sdk-root -mindepth 1 -maxdepth 1 -type d -name 'vcpkg-export-*' -print -quit)
          if [ -z "${SDK_DIR}" ]; then
            echo "ERROR: extracted SDK root not found"
            find sdk-root -maxdepth 3 -type d -print
            exit 1
          fi
          SDK_DIR_ABS=$(cd "${SDK_DIR}" && pwd -W)
          echo "WINDOWS_SDK_PATH=${SDK_DIR_ABS}" >> "${GITHUB_ENV}"

      - name: 🎡 Setup vcpkg
        if: ${{ env.USE_WINDOWS_SDK != 'true' || steps.download-sdk.outcome != 'success' }}
        uses: ./.github/actions/setup-vcpkg

      - name: 🦬 Setup flex/bison
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f #v1.13
        with:
          repository: 'lexxmark/winflexbison'
          fileName: '*.zip'
          tag: 'v2.5.24'
          extract: true

      - name: 🛍️ Setup ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 #v1.2
        with:
          max-size: 1G
          key: build-ccache-win64-qt6-${{ github.event.pull_request.base.ref || github.ref_name }}
          save: ${{ github.event_name == 'push' }}

      - name: 🛍️ Tune ccache configuration
        shell: bash
        run: |
          # To make ccache work properly with precompiled headers
          ccache --set-config sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime

      - name: 🪟 Install NSIS
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        run: choco install nsis -y --no-progress
        shell: bash

      - name: 🔐 Azure login for Windows code signing
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        uses: azure/login@2dd0bbf4064d5a1812889dc200bb8eed2597f82a # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 🔏 Prepare Windows code signing tools
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        shell: powershell
        env:
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERT_PROFILE_NAME }}
        run: .\scripts\ci\prepare-windows-signing.ps1

      - name: Verify signing service and prepare signed NSIS plugins
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        shell: powershell
        run: |
          ./scripts/ci/test-windows-signing-service.ps1
          ./scripts/ci/prepare-nsis-signing.ps1

      - name: 🌱 Install dependencies and generate project files
        id: cmake-configure
        shell: bash
        env:
          X_VCPKG_ASSET_SOURCES: x-azurl,https://assetcache.open-vcpkg.org/assetcache,,read
        run: |
          BUILD_DIR=$( cygpath "${{ github.workspace }}/build" )
          SOURCE_DIR=$( cygpath "${{ github.workspace }}" )

          if [[ "${IS_STRATA_RELEASE}" == "true" ]]; then
            APP_NAME_OPT='-DQGIS_APP_NAME=Strata'
            NSIS_OPT='-DCREATE_NSIS=TRUE'
            STRATA_TAG="${GITHUB_REF#refs/tags/}"
            STRATA_VERSION_OPT="-DSTRATA_VERSION=${STRATA_TAG#strata-v}"
            CODE_SIGN_OPT='-DSTRATA_WINDOWS_CODE_SIGN=ON'
          else
            APP_NAME_OPT=''
            NSIS_OPT=''
            STRATA_VERSION_OPT=''
            CODE_SIGN_OPT=''
          fi

          VCPKG_OPTS=(
                -D VCPKG_TARGET_TRIPLET=x64-windows-release
                -D VCPKG_HOST_TRIPLET=x64-windows-release
          )

          if [ -n "${WINDOWS_SDK_PATH:-}" ]; then
            VCPKG_OPTS+=(-D "SDK_PATH=${WINDOWS_SDK_PATH}")
          else
            echo "::warning::Windows SDK unavailable; rebuilding dependencies from vcpkg (this can take several hours)."
            VCPKG_OPTS+=(
                -D WITH_VCPKG=ON
                -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src"
                -D NUGET_BINARY_SOURCE_MODE=readwrite
                -D "NUGET_USERNAME=${GITHUB_ACTOR}"
                -D NUGET_SOURCE="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                -D NUGET_PUSH_SOURCE="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
                -D NUGET_TOKEN=${{ secrets.GITHUB_TOKEN }}
            )
          fi

          cmake -S "${SOURCE_DIR}" \
                -B "${BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=Release \
                -D CREATE_ZIP=ON \
                ${NSIS_OPT} \
                ${APP_NAME_OPT} \
                ${STRATA_VERSION_OPT} \
                ${CODE_SIGN_OPT} \
                -D WITH_DESKTOP=ON \
                -D WITH_3D=ON \
                -D WITH_PYTHON=ON \
                -D WITH_BINDINGS=ON \
                -D WITH_GEOGRAPHICLIB=OFF \
                -D WITH_SFCGAL=OFF \
                -D ENABLE_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D ENABLE_UNITY_BUILDS=ON \
                -D FLEX_EXECUTABLE="${SOURCE_DIR}/win_flex.exe" \
                -D BISON_EXECUTABLE="${SOURCE_DIR}/win_bison.exe" \
                -D USE_CCACHE=ON \
                -D WITH_QTWEBENGINE=OFF \
                "${VCPKG_OPTS[@]}"

          if [ -z "${WINDOWS_SDK_PATH:-}" ]; then
            cmake -D VCPKG_INSTALL_OPTIONS="--x-buildtrees-root=C:/src" "${BUILD_DIR}"
          fi

      - name: 🌋 Build
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --config Release

#      - uses: m-kuhn/action-tmate@patch-1
#        if: failure()

      - name: 📦 Package
        shell: bash
        run: |
          cmake --build "${{ github.workspace }}/build" --target bundle --config Release

      - name: 🐍 Verify PyQGIS runtime in Windows package
        shell: powershell
        run: |
          $zip = Get-ChildItem -Path "${{ github.workspace }}\build" -File -Filter "*-win64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "No Windows zip artifact found under build/."
          }
          python scripts/ci/verify_pyqgis_bundle.py --platform windows "$($zip.FullName)"

      - name: Verify installed and portable Windows packages
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        shell: powershell
        run: ./scripts/ci/verify-windows-package.ps1 -BuildDirectory build -ReportPath build/windows-verification.json

      - name: 📦 Create SDK
        if: ${{ env.USE_WINDOWS_SDK != 'true' || steps.download-sdk.outcome != 'success' }}
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        run: |
          vcpkg.exe export --zip --output-dir=./sdk --x-install-root=./build/vcpkg_installed --x-manifest-root=vcpkg

      - name: 📤 Upload sdk
        if: ${{ env.USE_WINDOWS_SDK != 'true' || steps.download-sdk.outcome != 'success' }}
#        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        with:
          name: strata-sdk-x64-windows
          path: |
            sdk/vcpkg-export-*.zip

      - name: 📑 Upload dep build logs
        id: upload-build-logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        if: failure()
        with:
          name: build-logs-x64-windows
          path: |
            C:/src/**/*.log

      - name: 🧮 Report vcpkg build failures
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/vcpkg_build_failures_report
        with:
          buildtrees-dir: C:/src
          triplet: x64-windows
          pr: ${{ github.event.number }}
          artifact-url: ${{ steps.upload-build-logs.outputs.artifact-url }}
          build-status: ${{ job.status }}
          manifest-install-log: ${{ github.workspace }}/build/vcpkg-manifest-install.log
          commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 📤 Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1

        id: artifact-win64-qt6
        with:
          name: strata-windows-qt6
          path: |
            build/*-win64.zip
            build/*.exe

      - name: Upload release assets
        if: ${{ env.IS_STRATA_RELEASE == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/ci/release-assets.mjs upload "$RELEASE_TAG" windows build/*-win64.exe build/*-win64.zip build/windows-verification.json

      - name: Schedule download comment
        uses: ./.github/actions/post_sticky_comment
        if: github.event_name == 'pull_request'
        with:
          marker: mingw64-qt6
          body: |
            ### 🪟 Windows Qt6 builds
            Download [Windows Qt6 builds of this PR for testing](${{ steps.artifact-win64-qt6.outputs.artifact-url }}).
            To execute locally, unzip the downloaded zip file and run `bin\qgis-bin.exe` in the extracted directory.
            You might be prompted by Windows Defender click "Run anyway"
            *(Built from commit ${{ github.event.pull_request.head.sha }})*
          pr: ${{ github.event.number }}

      - name: Upload Windows verification evidence
        if: ${{ always() && env.IS_STRATA_RELEASE == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-verification-evidence
          path: |
            build/windows-verification.json
            ${{ runner.temp }}/signing-probe.json
            ${{ runner.temp }}/nsis-signatures.json
            ${{ runner.temp }}/strata-package-*/*.json
