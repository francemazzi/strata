name: macOS notarization diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Read this release submission and its Apple diagnostic
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
          MACOS_APPLE_APP_PASSWORD: ${{ secrets.MACOS_APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool history --apple-id "$MACOS_APPLE_ID" --team-id "$MACOS_APPLE_TEAM_ID" --password "$MACOS_APPLE_APP_PASSWORD" --output-format json > history.json
          submission=$(python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('history.json').read_text())
          matches=[x for x in data['history'] if x['name']=='Strata-Installer.dmg' and '2026-10-06T13:49:00' <= x['createdDate'] <= '2026-10-06T14:07:00']
          assert len(matches)==1,matches
          pathlib.Path('submission.json').write_text(json.dumps(matches[0],indent=2)+'\n')
          print(matches[0]['id'])
          PY
          )
          xcrun notarytool log "$submission" --apple-id "$MACOS_APPLE_ID" --team-id "$MACOS_APPLE_TEAM_ID" --password "$MACOS_APPLE_APP_PASSWORD" notary-log.json
          python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('notary-log.json').read_text())
          print(json.dumps({k:data.get(k) for k in ['status','statusSummary','statusCode','issues']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-notary-diagnostic
          path: |
            submission.json
            notary-log.json
          if-no-files-found: error
