name: Candidate package PostGIS verification
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate platform to test
        type: choice
        options: [all, linux, windows]
        default: all
        required: true
permissions:
  contents: read
jobs:
  linux-candidate-postgis:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: strata_crs_candidate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55013:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        run: |
          test "$(git rev-parse 'strata-v1.6.3^{commit}')" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Download and verify the current draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view strata-v1.6.3 --repo francemazzi/strata --json assets > candidate-release.json
          gh release download strata-v1.6.3 --repo francemazzi/strata --pattern Strata-1.6.3-x86_64.AppImage
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          name = 'Strata-1.6.3-x86_64.AppImage'
          assets = json.loads(pathlib.Path('candidate-release.json').read_text())['assets']
          matches = [a for a in assets if a['name'] == name]
          assert len(matches) == 1
          with open(name,'rb') as file: digest = hashlib.file_digest(file,'sha256').hexdigest()
          assert matches[0]['digest'] == 'sha256:' + digest
          PYCODE
          chmod +x Strata-1.6.3-x86_64.AppImage
      - name: Configure virtual display for the packaged desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libopengl0 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify the recovered packaged CRS catalog
        run: xvfb-run -a python3 scripts/ci/verify_crs_runtime.py ./Strata-1.6.3-x86_64.AppImage --output crs-runtime-linux.json
      - name: Test packaged desktop with isolated PostGIS
        env:
          STRATA_CRS_TEST_DB: host=127.0.0.1 port=55013 dbname=strata_crs_candidate user=postgres sslmode=disable
        run: xvfb-run -a python3 scripts/ci/test_candidate_postgis.py ./Strata-1.6.3-x86_64.AppImage --asset Strata-1.6.3-x86_64.AppImage --output postgis-candidate-linux.json
      - name: Verify the corrected constructor allocation
        run: |
          sudo apt-get install -y --no-install-recommends valgrind binutils
          ./Strata-1.6.3-x86_64.AppImage --appimage-extract >/dev/null
          # Optional debug metadata only, in a disposable extraction. Published
          # AppImage and the application executable are unchanged.
          sha256sum squashfs-root/usr/bin/Strata > constructor-executable-before.sha256
          find squashfs-root/usr/plugins -type f -name '*.so' -exec strip --strip-debug {} +
          sha256sum --check constructor-executable-before.sha256
          mkdir -p "$RUNNER_TEMP/memory-profile/profiles/test/Strata"
          printf '[authentication]\nuse-password-helper=false\ngenerate-random-password-for-keychain=false\n' > "$RUNNER_TEMP/memory-profile/profiles/test/Strata/Strata.ini"
          QT_QPA_PLATFORM=xcb QTWEBENGINE_DISABLE_SANDBOX=1 PYTHONDONTWRITEBYTECODE=1 STRATA_PYQGIS_SMOKE_OUT="$GITHUB_WORKSPACE/constructor-smoke.json" timeout 180s xvfb-run -a valgrind --trace-children=yes --undef-value-errors=no --num-callers=18 --error-limit=yes --log-file=constructor-memcheck.%p.txt /bin/bash squashfs-root/AppRun --profiles-path "$RUNNER_TEMP/memory-profile" --profile test --noplugins --noversioncheck --nologo --code "$GITHUB_WORKSPACE/scripts/ci/smoke_pyqgis.py" > constructor-stdout.txt 2>&1
          python3 - <<'PYCODE'
          import json,pathlib
          smoke=json.loads(pathlib.Path('constructor-smoke.json').read_text())
          failures=[]
          for path in pathlib.Path('.').glob('constructor-memcheck.*.txt'):
              lines=path.read_text().splitlines()
              for i,line in enumerate(lines):
                  if 'Invalid write' in line and 'QgisApp::QgisApp' in '\n'.join(lines[i:i+24]):
                      failures.append({'log':str(path),'line':i+1})
          result={'constructor_invalid_writes':failures,'desktop_smoke_completed':True,'scope':'QgisApp constructor allocation; no claim that all third-party Memcheck diagnostics are clean'}
          pathlib.Path('constructor-regression.json').write_text(json.dumps(result,indent=2)+'\n')
          assert not failures,failures
          PYCODE
      - name: Diagnose Linux desktop startup on failure
        if: failure()
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          chmod +x Strata-1.6.3-x86_64.AppImage
          ./Strata-1.6.3-x86_64.AppImage --appimage-extract > /dev/null
          mkdir -p "$RUNNER_TEMP/debug-profile/profiles/test/Strata"
          printf '[authentication]\nuse-password-helper=false\ngenerate-random-password-for-keychain=false\n' > "$RUNNER_TEMP/debug-profile/profiles/test/Strata/Strata.ini"
          QT_QPA_PLATFORM=xcb QTWEBENGINE_DISABLE_SANDBOX=1 timeout 90s xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt' --args /bin/bash squashfs-root/AppRun --profiles-path "$RUNNER_TEMP/debug-profile" --profile test --noplugins --noversioncheck --nologo --code "$GITHUB_WORKSPACE/scripts/ci/smoke_pyqgis.py" > linux-startup-backtrace.txt 2>&1 || true
          tail -n 160 linux-startup-backtrace.txt
          sudo apt-get install -y --no-install-recommends valgrind
          QT_QPA_PLATFORM=xcb QTWEBENGINE_DISABLE_SANDBOX=1 timeout 100s xvfb-run -a valgrind --trace-children=yes --track-origins=yes --num-callers=24 --error-limit=yes --log-file=linux-valgrind.%p.txt /bin/bash squashfs-root/AppRun --profiles-path "$RUNNER_TEMP/valgrind-profile" --profile test --noplugins --noversioncheck --nologo --code "$GITHUB_WORKSPACE/scripts/ci/smoke_pyqgis.py" > linux-valgrind-stdout.txt 2>&1 || true
          for report in linux-valgrind.*.txt; do head -n 350 "$report"; done
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-linux
          path: |
            postgis-candidate-linux.json
            crs-runtime-linux.json
            candidate-release.json
            linux-startup-backtrace.txt
            linux-valgrind*.txt
            constructor-*.txt
            constructor-*.json
            constructor-executable-before.sha256
          if-no-files-found: error
  candidate-postgis:
    if: inputs.platform != 'linux'
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        shell: bash
        run: |
          test "$(git rev-parse 'strata-v1.6.3^{commit}')" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Test candidate with isolated PostGIS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/test-candidate-postgis-windows.ps1
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-windows
          path: postgis-candidate-windows.json
          if-no-files-found: error
