name: Candidate package PostGIS verification
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Candidate platform to test
        type: choice
        options: [all, linux, windows]
        default: all
        required: true
permissions:
  contents: read
jobs:
  linux-candidate-postgis:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: strata_crs_candidate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55013:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        run: |
          test "$(git rev-parse 'strata-v1.6.3^{commit}')" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Recover and verify immutable AppImage build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/francemazzi/strata/actions/artifacts/11418791128 > source-artifact.json
          gh api repos/francemazzi/strata/actions/artifacts/11418791128/zip > source-artifact.zip
          git diff --exit-code strata-v1.6.3 23d4e46f0365510d8e4b057c35f5992231f0ceb1 -- . ':!.github/workflows/build-appimage.yml'
          python3 - <<'PYCODE'
          import hashlib,json,pathlib,zipfile
          artifact=json.loads(pathlib.Path('source-artifact.json').read_text())
          assert artifact['workflow_run']['id']==37465170765
          assert artifact['workflow_run']['head_sha']=='23d4e46f0365510d8e4b057c35f5992231f0ceb1'
          with open('source-artifact.zip','rb') as file: digest=hashlib.file_digest(file,'sha256').hexdigest()
          assert artifact['digest']=='sha256:'+digest
          name='Strata-1.6.3-x86_64.AppImage'
          with zipfile.ZipFile('source-artifact.zip') as archive:
              assert name in archive.namelist()
              pathlib.Path(name).write_bytes(archive.read(name))
          PYCODE
          chmod +x Strata-1.6.3-x86_64.AppImage
      - name: Configure virtual display for the packaged desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libopengl0 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0
      - name: Verify the recovered packaged CRS catalog
        run: xvfb-run -a python3 scripts/ci/verify_crs_runtime.py ./Strata-1.6.3-x86_64.AppImage --output crs-runtime-linux.json
      - name: Test packaged desktop with isolated PostGIS
        env:
          STRATA_CRS_TEST_DB: host=127.0.0.1 port=55013 dbname=strata_crs_candidate user=postgres sslmode=disable
        run: xvfb-run -a python3 scripts/ci/test_candidate_postgis.py ./Strata-1.6.3-x86_64.AppImage --asset Strata-1.6.3-x86_64.AppImage --output postgis-candidate-linux.json
      - name: Upload verified unchanged candidate to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate="$GITHUB_WORKSPACE/Strata-1.6.3-x86_64.AppImage"
          git worktree add --detach "$RUNNER_TEMP/release-source" strata-v1.6.3
          cd "$RUNNER_TEMP/release-source"
          test "$(git rev-parse HEAD)" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          node scripts/ci/release-assets.mjs upload strata-v1.6.3 linux "$candidate"
      - name: Diagnose Linux desktop startup on failure
        if: failure()
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          chmod +x Strata-1.6.3-x86_64.AppImage
          ./Strata-1.6.3-x86_64.AppImage --appimage-extract > /dev/null
          mkdir -p "$RUNNER_TEMP/debug-profile/profiles/test/Strata"
          printf '[authentication]\nuse-password-helper=false\ngenerate-random-password-for-keychain=false\n' > "$RUNNER_TEMP/debug-profile/profiles/test/Strata/Strata.ini"
          QT_QPA_PLATFORM=xcb QTWEBENGINE_DISABLE_SANDBOX=1 timeout 90s xvfb-run -a gdb -batch -ex run -ex 'thread apply all bt' --args /bin/bash squashfs-root/AppRun --profiles-path "$RUNNER_TEMP/debug-profile" --profile test --noplugins --noversioncheck --nologo --code "$GITHUB_WORKSPACE/scripts/ci/smoke_pyqgis.py" > linux-startup-backtrace.txt 2>&1 || true
          tail -n 160 linux-startup-backtrace.txt
          sudo apt-get install -y --no-install-recommends g++ qt6-base-dev qt6-declarative-dev
          cat > /tmp/qt-style.cpp <<'CPP'
          #include <QApplication>
          #include <QQuickStyle>
          #include <QDebug>
          int main(int argc, char **argv) { QApplication app(argc, argv); qDebug() << qVersion(); QQuickStyle::setStyle(QStringLiteral("Material")); qDebug() << "style passed"; }
          CPP
          g++ /tmp/qt-style.cpp -o /tmp/qt-style $(pkg-config --cflags --libs Qt6Widgets Qt6QuickControls2)
          for mode in system bundled controls_system core_system; do
            (
              export QT_QPA_PLATFORM=xcb
              if [ "$mode" != system ]; then
                export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/squashfs-root/usr/lib:$GITHUB_WORKSPACE/squashfs-root/usr/lib/x86_64-linux-gnu"
                export QT_PLUGIN_PATH="$GITHUB_WORKSPACE/squashfs-root/usr/lib/qt6/plugins:$GITHUB_WORKSPACE/squashfs-root/usr/lib/x86_64-linux-gnu/qt6/plugins"
              fi
              if [ "$mode" = controls_system ]; then export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libQt6QuickControls2.so.6; fi
              if [ "$mode" = core_system ]; then export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libQt6Core.so.6; fi
              timeout 30s xvfb-run -a /tmp/qt-style
            ) > "qt-probe-$mode.txt" 2>&1 && result=0 || result=$?
            echo "$mode exit: $result"
            cat "qt-probe-$mode.txt"
          done
          for name in Core QuickControls2 Qml Gui; do
            for directory in squashfs-root/usr/lib /usr/lib/x86_64-linux-gnu; do
              echo "$directory/libQt6$name.so.6"
              readelf -n "$directory/libQt6$name.so.6" | head -n 6
            done
          done
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-linux
          path: |
            postgis-candidate-linux.json
            crs-runtime-linux.json
            source-artifact.json
            linux-startup-backtrace.txt
            qt-probe-*.txt
          if-no-files-found: error
  candidate-postgis:
    if: inputs.platform != 'linux'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify test suite matches immutable candidate
        shell: bash
        run: |
          test "$(git rev-parse 'strata-v1.6.3^{commit}')" = 01ee92498993e2d8e3e0b375262d5f66f56a3a51
          git diff --exit-code strata-v1.6.3 -- tests/src/python/test_provider_postgres_crs.py
      - name: Test candidate with isolated PostGIS
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/test-candidate-postgis-windows.ps1
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgis-candidate-windows
          path: postgis-candidate-windows.json
          if-no-files-found: error
