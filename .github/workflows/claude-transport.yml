name: Claude native transport
on:
  workflow_dispatch:
  push:
    branches: ['fix/claude-code-subscription']
  pull_request:
    paths:
      - 'src/app/ai/qgsaiclaude*'
      - 'tests/claude-transport/**'
      - 'tests/src/app/*claude*'
      - '.github/workflows/claude-transport.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Linux Qt
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev ninja-build
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Install Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt" --archives qtbase
          "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        run: cmake -S tests/claude-transport -B build/claude-transport
      - name: Build
        run: cmake --build build/claude-transport --config Release --parallel 2
      - name: Test native process and MCP lifecycle
        run: ctest --test-dir build/claude-transport -C Release --output-on-failure --output-junit claude-transport-results.xml
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: claude-transport-${{ matrix.os }}
          path: build/claude-transport/claude-transport-results.xml
